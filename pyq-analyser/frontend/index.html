<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PYQ Analyzer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">

  <!-- HEADER -->
  <header class="header">
    <h1>📚 PYQ Analyzer</h1>
    <p>Upload previous year question papers and get them solved instantly.</p>
  </header>

  <!-- MAIN LAYOUT -->
  <main class="main-layout">

    <!-- LEFT PANEL -->
    <div class="left-panel">

      <!-- UPLOAD (CENTER & HIGHLIGHTED) -->
      <section id="uploader" class="card upload-card">
        <h2>📄 Upload Question Paper</h2>
        <input id="fileInput" type="file" />
        <button id="uploadBtn">Upload & Process</button>
        <div id="uploadStatus"></div>
      </section>

      <!-- SOLVED QUESTION PAPER PREVIEW -->
      <section class="card answer-sheet-preview">
        <h2>📝 Solved Question Paper</h2>
        <p id="totalQuestions">No paper analyzed yet</p>
        <button id="viewAnswersBtn" disabled>
          View Full Answers →
        </button>
      </section>

      <!-- ASK QUESTION -->
      <section id="ask" class="card">
        <h2>❓ Ask a Question</h2>
        <textarea
          id="questionInput"
          placeholder="Ask from the uploaded paper..."
        ></textarea>
        <button id="askBtn">Ask</button>
        <div id="answerArea"></div>
      </section>

      <!-- CONVERSATION -->
      <section id="history" class="card">
        <h2>💬 Conversation</h2>
        <div id="chat"></div>
        <button id="clearChat">Clear</button>
      </section>

    </div>
  </main>

  <!-- FULLSCREEN ANSWER MODAL -->
  <div id="answerModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📘 Solved Question Paper</h2>
        <button id="closeModal">✖</button>
      </div>

      <div id="fullAnswerSheet" class="white-sheet">
        <!-- Questions & answers injected via JS -->
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <small>FastAPI Backend | PYQ Analyzer</small>
  </footer>

</div>

<script src="app.js"></script>
</body>
</html>
